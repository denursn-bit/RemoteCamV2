name: Build RemoteCam V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RemoteCamV2 project
        run: |
          mkdir extracted
          unzip -q RemoteCamV2-fixed2.zip -d extracted
          ls -la extracted/RemoteCamV2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: extracted/RemoteCamV2
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCamV2-debug
          path: extracted/RemoteCamV2/app/build/outputs/apk/debug/app-debug.apk
